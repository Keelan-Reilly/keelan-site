<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>
  {{ if .IsHome }}Keelan Reilly{{ else }}{{ .Title }} — Keelan Reilly{{ end }}
</title>
{{ with (.Params.summary | default .Params.description) }}
<meta name="description" content="{{ . }}" />
<meta property="og:description" content="{{ . }}" />
{{ end }}
<meta property="og:title" content="{{ if .IsHome }}Keelan Reilly{{ else }}{{ .Title }} — Keelan Reilly{{ end }}" />
<meta property="og:type" content="{{ if .IsHome }}profile{{ else if .IsPage }}article{{ else }}website{{ end }}" />
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Keelan Reilly",
  "jobTitle": "Electronic Engineer",
  "description": "Electronic engineer working across digital hardware, embedded software, electronics, Linux and system architecture.",
  "sameAs": [
    "https://github.com/Keelan-Reilly",
    "https://www.linkedin.com/in/keelan-reilly-b22b5a296"
  ],
  "knowsAbout": [
    "Electronic system architecture",
    "FPGA and RTL design",
    "Embedded systems",
    "PCB design",
    "Hardware-software co-design",
    "System verification"
  ]
}
</script>
{{ end }}

{{ $css := resources.Get "css/main.css" | minify }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">

{{ if .Param "math" }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  renderMathInElement(document.body, {
    delimiters: [
      { left: "\\[", right: "\\]", display: true },
      { left: "$$", right: "$$", display: true },
      { left: "\\(", right: "\\)", display: false }
    ],
    ignoredTags: ["script", "noscript", "style", "textarea", "pre", "code"],
    throwOnError: false
  });
});
</script>
{{ end }}
