{{ define "main" }}
<div class="container">
  <div class="article-wrap">

    <a class="back-link" href="{{ "/" | relURL }}">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      All projects
    </a>

    <h1 class="article-title">{{ .Title }}</h1>

    {{ with .Params.summary }}
      <p class="article-summary">{{ . }}</p>
    {{ end }}

    {{ with .Params.kpis }}
      <div class="kpi-grid">
        {{ range . }}
          <div class="kpi-box">
            <div class="kpi-box-label">{{ .label }}</div>
            <div class="kpi-box-value">{{ .value }}</div>
            {{ with .note }}<div class="kpi-box-note">{{ . }}</div>{{ end }}
          </div>
        {{ end }}
      </div>
    {{ end }}

    <hr class="article-rule" />

    <div class="article-body">
      {{ .Content }}
    </div>

    {{ with .Params.repo }}
      <a class="repo-link" href="{{ . }}" target="_blank" rel="noopener">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.1.82-.26.82-.58v-2.03c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0 2.04.13 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57C20.57 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        View source on GitHub
      </a>
    {{ end }}

  </div>
</div>
{{ end }}
