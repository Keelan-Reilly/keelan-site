<!doctype html>
<html lang="en">
  <head>{{ partial "head.html" . }}</head>
  <body>
    <div class="site">
      <nav class="site-nav">
        <div class="container">
          <div class="nav-inner">
            <a class="nav-brand" href="{{ "/" | relURL }}">Keelan Reilly</a>
            <div class="nav-links">
              <a href="https://github.com/Keelan-Reilly" target="_blank" rel="noopener">GitHub</a>
              <a href="https://www.linkedin.com/in/keelan-reilly-b22b5a296" target="_blank" rel="noopener">LinkedIn</a>
              <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">
                <span class="theme-toggle-icon" aria-hidden="true"></span>
                <span class="theme-toggle-label">Theme</span>
              </button>
            </div>
          </div>
        </div>
      </nav>
      <main class="site-main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
    <script>
      (function () {
        var button = document.getElementById('theme-toggle');
        if (!button) return;
        function updateLabel() {
          var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          button.setAttribute('aria-label', 'Switch to ' + next + ' theme');
        }
        updateLabel();
        button.addEventListener('click', function () {
          var current = document.documentElement.dataset.theme;
          var next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.dataset.theme = next;
          localStorage.setItem('theme', next);
          updateLabel();
        });
      })();
    </script>
  </body>
</html>
